<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETHIOBET - እውነተኛ ጨዋታዎች እና የመሃኛ</title>
    <meta name="description" content="ETHIOBET - ምርጥ የኦንላይን ጨዋታዎች">
</head>
<body style="background: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px;">

    <h1>Welcome to ETHIOBET</h1>

    <!-- የቢንጎ ማሳያ ሳጥን -->
    <div class="bingo-container" style="background: #1e1e1e; color: #fff; padding: 20px; border-radius: 10px; text-align: center; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
      <h3 style="color: #00ffcc;">Standard Bingo (1-75)</h3>
      <div class="live-ball-display">
        <h4>የወጣው ኳስ፦ <span id="current-ball" style="color: #ff0055; font-size: 28px;">--</span></h4>
      </div>

      <div class="board-selector" style="margin: 15px 0;">
        <label>ቦርድ ቁጥር (1-150)፦ </label>
        <input type="number" id="board-number" min="1" max="150" value="1" style="padding: 5px; width: 60px; text-align: center; font-weight: bold;">
        <button onclick="loadBingoBoard()" style="padding: 6px 15px; background: #00ffcc; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">ቦርድ ክፈት</button>
      </div>

      <div id="bingo-grid" style="display: inline-block; margin: 10px 0;">
        <!-- ቦርዱ በ JS ይሞላል -->
      </div>

      <div style="margin-top: 15px;">
        <button id="bingo-btn" onclick="claimBingo()" style="padding: 10px 25px; background: #ff0055; color: #fff; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px;">BINGO! 🎉</button>
      </div>
    </div>

    <script>
    let currentBoardData = null;

    function loadBingoBoard() {
        const boardId = document.getElementById('board-number').value;
        fetch(`/api/bingo/board/${boardId}`)
            .then(res => res.json())
            .then(data => {
                currentBoardData = data.grid;
                renderGrid(data.grid);
            });
    }

    function renderGrid(grid) {
        const container = document.getElementById('bingo-grid');
        let html = '<div style="display: grid; grid-template-columns: repeat(5, 55px); gap: 4px; background: #333; padding: 5px; border-radius: 5px;">';
        ['B','I','N','G','O'].forEach(l => html += `<div style="font-weight:bold; background:#222; color:#00ffcc; padding:8px 0; font-size:14px;">${l}</div>`);
        
        for (let row = 0; row < 5; row++) {
            ['B','I','N','G','O'].forEach(letter => {
                let val = grid[letter][row];
                html += `<div class="bingo-cell" id="cell-${val}" style="background:#2a2a2a; color:#fff; padding:10px 0; font-size:13px; border:1px solid #444; border-radius:3px;">${val}</div>`;
            });
        }
        html += '</div>';
        container.innerHTML = html;
    }

    // መጀመሪያ ሲከፈት ነባሪ ቦርድ 1ን መጫን
    window.onload = function() {
        loadBingoBoard();
    };

    setInterval(() => {
        fetch('/api/bingo/live')
            .then(res => res.json())
            .then(data => {
                if (data.current_number) {
                    document.getElementById('current-ball').innerText = data.current_number;
                    data.drawn_numbers.forEach(num => {
                        let cell = document.getElementById(`cell-${num}`);
                        if (cell) {
                            cell.style.background = "#00ffcc";
                            cell.style.color = "#000";
                            cell.style.fontWeight = "bold";
                        }
                    });
                }
            });
    }, 1000);

    function claimBingo() {
        const boardId = document.getElementById('board-number').value;
        const userPhone = localStorage.getItem('user_phone'); 
        
        if (!userPhone) {
            alert("እባክዎ በመጀመሪያ ወደ መለያዎ ይግቡ (Login)!");
            return;
        }

        fetch('/api/bingo/claim', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: userPhone, board_id: boardId })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if (data.success) {
                location.reload();
            }
        });
    }
    </script>

</body>
</html>
